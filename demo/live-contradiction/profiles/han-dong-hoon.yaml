      text: 대통령의 조기 퇴진 의사가 없음이 확인된 이상 즉각적인 직무 정지가 필요합니다. 더 이상의 혼란은 막아야 합니다. 이제 그 유효한 방식은 단 하나뿐입니다.
      date: '2024-12-12'
