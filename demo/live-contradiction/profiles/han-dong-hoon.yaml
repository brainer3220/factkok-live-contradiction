      context: 과거는 준비 없는 혼란에 따른 국민과 지지자 피해를 이유로 당시 탄핵안 통과를 막겠다는 입장이다. 위헌적 계엄을 옹호하지 않는다는 단서도 함께 보존한다. 현재는 대통령의 조기 퇴진 불응과 사안의 심각성에 관한 후속 확인을 이유로 탄핵을 통한 즉각적인 직무 정지를 요구한 12월 12일 기자회견이다. 단 하나의 유효한 방식은 탄핵 절차를 뜻하며, 같은 날 MBC 뉴스데스크와 SBS 현장영상 기사에서 명시적 탄핵 찬성을 확인했다. 시점과 상황이 달라진 공개 입장 변화이며 거짓말이나 동기 판정의 근거가 아니다.
